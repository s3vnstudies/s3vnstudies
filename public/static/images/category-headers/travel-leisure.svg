<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#06b6d4" opacity="0.1" />
  <rect x="0" y="0" width="800" height="300" fill="url(#waves)" opacity="0.3" />
  <rect x="0" y="280" width="800" height="20" fill="#06b6d4" opacity="0.6" />
  
  <!-- Palm Tree -->
  <g transform="translate(400, 150)">
    <rect x="-10" y="0" width="20" height="100" fill="#a16207" stroke="#78350f" stroke-width="1" />
    <path d="M0 0 C-30 -30 -60 -10 -80 -40 C-40 -30 -30 -40 0 -20 C30 -40 40 -30 80 -40 C60 -10 30 -30 0 0 Z" fill="#84cc16" stroke="#65a30d" stroke-width="1" />
    <path d="M0 -20 C-30 -50 -40 -40 -60 -70 C-20 -50 -10 -60 0 -40 C10 -60 20 -50 60 -70 C40 -40 30 -50 0 -20 Z" fill="#84cc16" stroke="#65a30d" stroke-width="1" />
    <path d="M0 -40 C-15 -60 -20 -55 -30 -85 C-10 -65 -5 -70 0 -55 C5 -70 10 -65 30 -85 C20 -55 15 -60 0 -40 Z" fill="#84cc16" stroke="#65a30d" stroke-width="1" />
  </g>
  
  <!-- Sun -->
  <circle cx="140" cy="70" r="40" fill="#fbbf24" />
  <circle cx="140" cy="70" r="30" fill="#f59e0b" />
  
  <!-- Beach/Waves -->
  <path d="M0 200 L800 200" stroke="#0284c7" stroke-width="2" />
  <path d="M0 210 Q200 170 400 210 Q600 250 800 210" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M0 220 Q200 260 400 220 Q600 180 800 220" fill="none" stroke="#0ea5e9" stroke-width="2" />
  <path d="M0 230 Q200 190 400 230 Q600 270 800 230" fill="none" stroke="#0ea5e9" stroke-width="2" />
  <path d="M0 240 Q200 280 400 240 Q600 200 800 240" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M0 250 Q200 210 400 250 Q600 290 800 250" fill="#0ea5e9" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
  <path d="M0 260 Q200 300 400 260 Q600 220 800 260" fill="#0ea5e9" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
  <path d="M0 270 Q200 230 400 270 Q600 310 800 270" fill="#0ea5e9" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" />
  
  <!-- Beach -->
  <path d="M0 200 L800 200 L800 280 L0 280 Z" fill="#fef3c7" />
  
  <!-- Beach Umbrella -->
  <g transform="translate(650, 180)">
    <rect x="-2" y="0" width="4" height="80" fill="#737373" />
    <path d="M-50 0 Q-25 -30 0 0 Q25 -30 50 0" fill="#f87171" stroke="#ef4444" stroke-width="1" />
    <path d="M-40 0 L40 0" stroke="#ef4444" stroke-width="2" />
  </g>
  
  <!-- Cruise Ship -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="120" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <rect x="20" y="-20" width="80" height="20" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <rect x="30" y="-30" width="20" height="10" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
    <rect x="70" y="-30" width="20" height="10" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
    <circle cx="30" cy="15" r="5" fill="#0ea5e9" />
    <circle cx="60" cy="15" r="5" fill="#0ea5e9" />
    <circle cx="90" cy="15" r="5" fill="#0ea5e9" />
  </g>
  
  <defs>
    <pattern id="waves" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q10 15 20 20 Q30 25 40 20" stroke="#06b6d4" stroke-width="1" fill="none" />
      <path d="M0 30 Q10 35 20 30 Q30 25 40 30" stroke="#06b6d4" stroke-width="1" fill="none" />
    </pattern>
  </defs>
</svg>