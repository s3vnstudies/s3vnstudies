<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a825" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    <radialGradient id="blue-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- Dark background matching S3vn brand -->
  <rect width="800" height="300" fill="#0a1929" />
  <rect x="0" y="0" width="800" height="300" fill="url(#waves)" opacity="0.3" />
  <rect x="0" y="280" width="800" height="20" fill="url(#gold-gradient)" opacity="0.6" />
  
  <!-- Palm Tree -->
  <g transform="translate(400, 150)">
    <rect x="-10" y="0" width="20" height="100" fill="#1a2e45" stroke="#00838f" stroke-width="1" />
    <path d="M0 0 C-30 -30 -60 -10 -80 -40 C-40 -30 -30 -40 0 -20 C30 -40 40 -30 80 -40 C60 -10 30 -30 0 0 Z" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="1" />
    <path d="M0 -20 C-30 -50 -40 -40 -60 -70 C-20 -50 -10 -60 0 -40 C10 -60 20 -50 60 -70 C40 -40 30 -50 0 -20 Z" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="1" />
    <path d="M0 -40 C-15 -60 -20 -55 -30 -85 C-10 -65 -5 -70 0 -55 C5 -70 10 -65 30 -85 C20 -55 15 -60 0 -40 Z" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="1" />
  </g>
  
  <!-- Sun -->
  <circle cx="140" cy="70" r="40" fill="url(#blue-glow)" />
  <circle cx="140" cy="70" r="30" fill="url(#gold-gradient)" />
  
  <!-- Beach/Waves -->
  <path d="M0 200 L800 200" stroke="#0288d1" stroke-width="2" />
  <path d="M0 210 Q200 170 400 210 Q600 250 800 210" fill="none" stroke="#0288d1" stroke-width="2" />
  <path d="M0 220 Q200 260 400 220 Q600 180 800 220" fill="none" stroke="#00e5ff" stroke-width="2" />
  <path d="M0 230 Q200 190 400 230 Q600 270 800 230" fill="none" stroke="#00e5ff" stroke-width="2" />
  <path d="M0 240 Q200 280 400 240 Q600 200 800 240" fill="none" stroke="#0288d1" stroke-width="2" />
  <path d="M0 250 Q200 210 400 250 Q600 290 800 250" fill="#00e5ff" fill-opacity="0.3" stroke="#0288d1" stroke-width="1" />
  <path d="M0 260 Q200 300 400 260 Q600 220 800 260" fill="#00e5ff" fill-opacity="0.4" stroke="#0288d1" stroke-width="1" />
  <path d="M0 270 Q200 230 400 270 Q600 310 800 270" fill="#00e5ff" fill-opacity="0.5" stroke="#0288d1" stroke-width="1" />
  
  <!-- Beach -->
  <path d="M0 200 L800 200 L800 280 L0 280 Z" fill="#1a2e45" />
  
  <!-- Beach Umbrella -->
  <g transform="translate(650, 180)">
    <rect x="-2" y="0" width="4" height="80" fill="#1a2e45" />
    <path d="M-50 0 Q-25 -30 0 0 Q25 -30 50 0" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="1" />
    <path d="M-40 0 L40 0" stroke="#ffd54f" stroke-width="2" />
  </g>
  
  <!-- Cruise Ship -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="120" height="30" rx="5" fill="#0a1929" stroke="#00e5ff" stroke-width="2" />
    <rect x="20" y="-20" width="80" height="20" rx="2" fill="#0a1929" stroke="#00e5ff" stroke-width="2" />
    <rect x="30" y="-30" width="20" height="10" fill="#0a1929" stroke="#0288d1" stroke-width="1" />
    <rect x="70" y="-30" width="20" height="10" fill="#0a1929" stroke="#0288d1" stroke-width="1" />
    <circle cx="30" cy="15" r="5" fill="#00e5ff" />
    <circle cx="60" cy="15" r="5" fill="#00e5ff" />
    <circle cx="90" cy="15" r="5" fill="#00e5ff" />
  </g>
  
  <!-- S3vn brand-inspired decorative elements -->
  <circle cx="400" cy="40" r="8" fill="#ffd54f" />
  <circle cx="200" cy="40" r="5" fill="#00e5ff" />
  <circle cx="600" cy="40" r="5" fill="#00e5ff" />
  
  <defs>
    <pattern id="waves" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q10 15 20 20 Q30 25 40 20" stroke="#00838f" stroke-width="1" fill="none" />
      <path d="M0 30 Q10 35 20 30 Q30 25 40 30" stroke="#00838f" stroke-width="1" fill="none" />
    </pattern>
  </defs>
</svg>