<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a825" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    <radialGradient id="blue-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- Dark background matching S3vn brand -->
  <rect width="800" height="300" fill="#0a1929" />
  <rect x="0" y="0" width="800" height="300" fill="url(#dots)" opacity="0.3" />
  <rect x="0" y="280" width="800" height="20" fill="url(#gold-gradient)" opacity="0.6" />
  
  <!-- Palette -->
  <path d="M400 60 C320 60 270 130 270 180 C270 230 310 240 340 240 C370 240 380 220 400 220 C420 220 430 240 460 240 C490 240 530 230 530 180 C530 130 480 60 400 60 Z" fill="#1a2e45" stroke="#00e5ff" stroke-width="2" />
  
  <!-- Color dots -->
  <circle cx="330" cy="110" r="20" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="2" />
  <circle cx="350" cy="170" r="20" fill="url(#blue-glow)" stroke="#00e5ff" stroke-width="2" />
  <circle cx="430" cy="100" r="20" fill="url(#blue-glow)" stroke="#00e5ff" stroke-width="2" />
  <circle cx="470" cy="160" r="20" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="2" />
  
  <!-- Paintbrush -->
  <rect x="380" y="130" width="10" height="100" rx="5" fill="#0a1929" stroke="#00838f" stroke-width="1" transform="rotate(45, 385, 180)" />
  <path d="M355 130 Q365 120 375 130 L400 155 Q390 165 380 155 Z" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="1" transform="rotate(45, 385, 180)" />
  
  <!-- Craft Items -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="100" height="80" rx="5" fill="#0a1929" stroke="#00e5ff" stroke-width="2" />
    <rect x="10" y="10" width="80" height="60" fill="#1a2e45" stroke="#0288d1" stroke-width="1" />
    <path d="M25 25 L50 15 L75 25 L75 55 L50 65 L25 55 Z" fill="url(#blue-glow)" stroke="#00e5ff" stroke-width="1" />
  </g>
  
  <g transform="translate(550, 100)">
    <rect x="10" y="0" width="80" height="100" rx="2" fill="#1a2e45" stroke="#00e5ff" stroke-width="2" />
    <path d="M30 20 L70 20 M30 40 L70 40 M30 60 L70 60 M30 80 L70 80" stroke="url(#gold-gradient)" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- S3vn brand-inspired decorative elements -->
  <circle cx="400" cy="40" r="8" fill="#ffd54f" />
  <circle cx="200" cy="40" r="5" fill="#00e5ff" />
  <circle cx="600" cy="40" r="5" fill="#00e5ff" />
  
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#00838f" />
    </pattern>
  </defs>
</svg>