<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a825" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    <radialGradient id="blue-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- Dark background matching S3vn brand -->
  <rect width="800" height="300" fill="#0a1929" />
  <rect x="0" y="0" width="800" height="300" fill="url(#grid)" opacity="0.2" />
  <rect x="0" y="280" width="800" height="20" fill="url(#gold-gradient)" opacity="0.6" />

  <!-- S3vn-style book icon -->
  <g transform="translate(400, 150)">
    <!-- Book base -->
    <path d="M-60 -70 L60 -70 L60 70 L-60 70 Z" fill="#1a2e45" stroke="#00e5ff" stroke-width="2" />
    
    <!-- Book pages -->
    <path d="M-55 -65 L0 -65 L0 65 L-55 65 Z" fill="#0a1929" stroke="#0288d1" stroke-width="1" />
    <path d="M0 -65 L55 -65 L55 65 L0 65 Z" fill="#0a1929" stroke="#0288d1" stroke-width="1" />
    
    <!-- Page divider -->
    <path d="M0 -65 L0 65" stroke="#00e5ff" stroke-width="1" />
    
    <!-- Book decoration -->
    <path d="M-40 -45 L-15 -45 M-40 -25 L-15 -25 M-40 -5 L-15 -5 M-40 15 L-15 15 M-40 35 L-15 35" stroke="url(#gold-gradient)" stroke-width="2" stroke-linecap="round" />
    <path d="M15 -45 L40 -45 M15 -25 L40 -25 M15 -5 L40 -5 M15 15 L40 15 M15 35 L40 35" stroke="url(#gold-gradient)" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Orbital elements -->
  <ellipse cx="400" cy="150" rx="150" ry="150" fill="none" stroke="#00838f" stroke-width="1" opacity="0.3" />
  <ellipse cx="400" cy="150" rx="180" ry="180" fill="none" stroke="#00838f" stroke-width="1" opacity="0.3" />
  
  <!-- Small decorative elements inspired by S3vn logo -->
  <circle cx="400" cy="40" r="8" fill="#ffd54f" />
  <circle cx="320" cy="80" r="5" fill="#00e5ff" />
  <circle cx="480" cy="80" r="5" fill="#00e5ff" />
  <circle cx="280" cy="150" r="5" fill="#00e5ff" />
  <circle cx="520" cy="150" r="5" fill="#00e5ff" />
  <circle cx="320" cy="220" r="5" fill="#00e5ff" />
  <circle cx="480" cy="220" r="5" fill="#00e5ff" />
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 0 20 M 0 0 L 20 0" stroke="#00838f" stroke-width="0.5" opacity="0.2" fill="none" />
    </pattern>
  </defs>
</svg>