<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#f59e0b" opacity="0.1" />
  <rect x="0" y="0" width="800" height="300" fill="url(#grid)" opacity="0.2" />
  <rect x="0" y="280" width="800" height="20" fill="#f59e0b" opacity="0.6" />
  
  <!-- Trophy -->
  <path d="M400 60 L440 60 L440 80 L460 80 L460 100 L450 100 C450 130 470 150 470 150 L460 160 C460 160 440 150 430 150 L430 200 L460 220 L460 240 L340 240 L340 220 L370 200 L370 150 C360 150 340 160 340 160 L330 150 C330 150 350 130 350 100 L340 100 L340 80 L360 80 L360 60 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  <ellipse cx="400" cy="120" rx="30" ry="50" fill="#f59e0b" opacity="0.5" />
  
  <!-- Collection Items -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <rect x="10" y="10" width="60" height="80" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1" />
    <rect x="20" y="20" width="40" height="30" fill="#cbd5e1" />
    <rect x="20" y="60" width="40" height="5" fill="#94a3b8" />
    <rect x="20" y="70" width="30" height="5" fill="#94a3b8" />
  </g>
  
  <g transform="translate(570, 100)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <path d="M40 10 L70 50 L40 90 L10 50 Z" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="40" cy="50" r="10" fill="#0284c7" />
  </g>
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 0 20 M 0 0 L 20 0" stroke="#f59e0b" stroke-width="0.5" opacity="0.2" fill="none" />
    </pattern>
  </defs>
</svg>