<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a825" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    <radialGradient id="blue-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- Dark background matching S3vn brand -->
  <rect width="800" height="300" fill="#0a1929" />
  <rect x="0" y="0" width="800" height="300" fill="url(#grid)" opacity="0.2" />
  <rect x="0" y="280" width="800" height="20" fill="url(#gold-gradient)" opacity="0.6" />
  
  <!-- Trophy with brand colors -->
  <path d="M400 60 L440 60 L440 80 L460 80 L460 100 L450 100 C450 130 470 150 470 150 L460 160 C460 160 440 150 430 150 L430 200 L460 220 L460 240 L340 240 L340 220 L370 200 L370 150 C360 150 340 160 340 160 L330 150 C330 150 350 130 350 100 L340 100 L340 80 L360 80 L360 60 Z" fill="url(#gold-gradient)" stroke="#ff8f00" stroke-width="2" />
  <ellipse cx="400" cy="120" rx="30" ry="50" fill="url(#blue-glow)" opacity="0.5" />
  
  <!-- Collection Items -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="#0a1929" stroke="#00e5ff" stroke-width="2" />
    <rect x="10" y="10" width="60" height="80" rx="2" fill="#1a2e45" stroke="#0288d1" stroke-width="1" />
    <rect x="20" y="20" width="40" height="30" fill="#00838f" opacity="0.4" />
    <rect x="20" y="60" width="40" height="5" fill="#00e5ff" opacity="0.7" />
    <rect x="20" y="70" width="30" height="5" fill="#00e5ff" opacity="0.7" />
  </g>
  
  <g transform="translate(570, 100)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="#0a1929" stroke="#00e5ff" stroke-width="2" />
    <path d="M40 10 L70 50 L40 90 L10 50 Z" fill="url(#gold-gradient)" stroke="#ffd54f" stroke-width="1" />
    <circle cx="40" cy="50" r="10" fill="#00e5ff" />
  </g>
  
  <!-- S3vn brand-inspired decorative elements -->
  <circle cx="400" cy="40" r="8" fill="#ffd54f" />
  <circle cx="200" cy="40" r="5" fill="#00e5ff" />
  <circle cx="600" cy="40" r="5" fill="#00e5ff" />
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 0 20 M 0 0 L 20 0" stroke="#00838f" stroke-width="0.5" opacity="0.2" fill="none" />
    </pattern>
  </defs>
</svg>