<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background with subtle cityscape -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  
  <!-- Cityscape silhouette -->
  <path d="M0,630 L0,400 L50,400 L70,350 L100,350 L120,300 L150,300 L170,350 L200,350 L220,250 L250,250 L280,300 L320,300 L350,200 L380,200 L400,250 L430,250 L450,300 L500,300 L520,200 L550,200 L580,250 L600,250 L630,300 L650,300 L680,200 L700,200 L730,250 L750,250 L780,350 L800,350 L830,300 L870,300 L900,200 L950,200 L980,250 L1000,250 L1050,350 L1080,350 L1100,300 L1150,300 L1200,350 L1200,630 Z" fill="#0f172a" opacity="0.7" />
  
  <!-- Light beams -->
  <g opacity="0.1">
    <path d="M200,630 L600,0" stroke="#f8fafc" stroke-width="100" />
    <path d="M800,630 L400,0" stroke="#f8fafc" stroke-width="80" />
    <path d="M1100,630 L700,0" stroke="#f8fafc" stroke-width="120" />
  </g>
  
  <!-- Title -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">S3VN Studies Membership</text>
  
  <!-- Subtitle -->
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1" text-anchor="middle">Unlock Premium Content &amp; Features</text>
  
  <!-- Cards -->
  <g transform="translate(250, 220)" filter="url(#dropShadow)">
    <!-- Free Card -->
    <rect x="0" y="0" width="280" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="140" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Basic Access</text>
    <text x="140" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">FREE</text>
    
    <!-- Features -->
    <g transform="translate(30, 120)">
      <circle cx="10" cy="10" r="8" fill="#4ade80" />
      <text x="30" y="15" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Public content</text>
      
      <circle cx="10" cy="50" r="8" fill="#4ade80" />
      <text x="30" y="55" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Community forum</text>
      
      <circle cx="10" cy="90" r="8" fill="#4ade80" />
      <text x="30" y="95" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Monthly newsletter</text>
    </g>
    
    <rect x="40" y="250" width="200" height="40" rx="20" fill="#475569" />
    <text x="140" y="277" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Get Started</text>
  </g>
  
  <!-- Pro Card Highlighted -->
  <g transform="translate(650, 200)" filter="url(#dropShadow)">
    <!-- Banner -->
    <rect x="0" y="0" width="300" height="30" rx="6" fill="url(#highlightGradient)" />
    <text x="150" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BEST VALUE</text>
    
    <!-- Card -->
    <rect x="0" y="30" width="300" height="340" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="3" />
    <text x="150" y="70" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Pro Access</text>
    <text x="130" y="110" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">$2.99</text>
    <text x="200" y="110" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">/month</text>
    
    <!-- Features -->
    <g transform="translate(30, 140)">
      <circle cx="10" cy="10" r="8" fill="#4ade80" />
      <text x="30" y="15" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Everything in Basic</text>
      
      <circle cx="10" cy="40" r="8" fill="#4ade80" />
      <text x="30" y="45" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Full community access</text>
      
      <circle cx="10" cy="70" r="8" fill="#4ade80" />
      <text x="30" y="75" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Exclusive premium content</text>
      
      <circle cx="10" cy="100" r="8" fill="#4ade80" />
      <text x="30" y="105" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Early access to videos</text>
      
      <circle cx="10" cy="130" r="8" fill="#4ade80" />
      <text x="30" y="135" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Member-only chat rooms</text>
      
      <circle cx="10" cy="160" r="8" fill="#4ade80" />
      <text x="30" y="165" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Store discounts (15%)</text>
    </g>
    
    <rect x="50" y="330" width="200" height="40" rx="20" fill="url(#highlightGradient)" />
    <text x="150" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Join Now</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">Join our community today and unlock your full potential</text>
</svg>